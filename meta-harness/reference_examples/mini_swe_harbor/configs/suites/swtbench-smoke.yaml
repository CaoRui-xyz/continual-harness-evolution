schema_version: 1
id: swtbench-smoke
source:
  kind: local_path
  path: ${DATASETS_ROOT}/swtbench-verified-paraphrase/tasks
selection:
  task_name_prefix: ''
  task_names:
  - astropy__astropy-14539
  exclude_task_names: []
  expected_task_count: 1
  task_names_file: ${DATASETS_ROOT}/swtbench-verified-paraphrase/task_names.txt
execution:
  attempts: 1
  n_concurrent: 1
  task_timeout_seconds: 3600
  sandbox_timeout_seconds: 3600
scoring:
  metric: fraction_solved
  solved_reward_threshold: 1.0
